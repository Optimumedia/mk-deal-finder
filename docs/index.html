<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>MK Deal Finder</title>
<meta name="description" content="North Macedonian property deals, scored twice a day.">
<meta name="color-scheme" content="light dark">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Manrope:wght@600;700;800&display=swap">
<style>
:root{
  --bg:#f6f6f3;--surface:#ffffff;--surface-2:#f0f0ec;--surface-3:#e8e8e3;
  --ink:#15171c;--ink-2:#4f5561;--ink-3:#737985;--line:#e2e2dc;--line-2:#d2d2ca;
  --accent:#0d6b57;--accent-ink:#ffffff;--accent-soft:#e1f1ec;--accent-text:#0b5c4b;
  --good:#17733f;--good-soft:#e2f3e8;--warn:#9a5b00;--warn-soft:#fbefd9;--bad:#b42318;--bad-soft:#fbe5e2;
  --gA:#17733f;--gA-ink:#fff;--gB:#1d5fa8;--gB-ink:#fff;--gC:#5f6672;--gC-ink:#fff;
  --bar:#1d5fa8;--bar-weak:#9bbbe0;
  --t0:#5b3fc4;--t0-soft:#f1edfd;--t0-line:#c9bcf3;--t1:#b4410f;--t1-soft:#fdefe6;--t1-line:#f1c2a4;--t2:#1d5fa8;
  --ni:#0b5f86;--ni-soft:#e2f2fa;--ni-line:#9fd0e8;
  --shadow-1:0 1px 2px rgba(20,22,28,.06);
  --shadow-2:0 1px 2px rgba(20,22,28,.05),0 8px 24px rgba(20,22,28,.07);
  --scrim:rgba(15,17,22,.45);
  --r-s:8px;--r-m:12px;--r-l:16px;
  --s1:4px;--s2:8px;--s3:12px;--s4:16px;--s5:20px;--s6:24px;--s8:32px;--s10:40px;--s12:48px;
  --font:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --font-d:"Manrope","Inter",system-ui,sans-serif;
  --maxw:1240px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1114;--surface:#171a1f;--surface-2:#1f232a;--surface-3:#282d35;
  --ink:#eef0f3;--ink-2:#b4bac4;--ink-3:#8b929e;--line:#2a2f37;--line-2:#3a404a;
  --accent:#4cc3a3;--accent-ink:#06231c;--accent-soft:#16332c;--accent-text:#6fd6b9;
  --good:#5fd08f;--good-soft:#173324;--warn:#f0b357;--warn-soft:#3a2c12;--bad:#ff8a80;--bad-soft:#3d1c1a;
  --gA:#2f9e63;--gA-ink:#04170c;--gB:#5b9be6;--gB-ink:#061527;--gC:#8a919c;--gC-ink:#0f1114;
  --bar:#6ea8ec;--bar-weak:#36506f;
  --t0:#c3b3ff;--t0-soft:#29233f;--t0-line:#54479a;--t1:#ffab78;--t1-soft:#36241a;--t1-line:#80492a;--t2:#86b8f2;
  --ni:#7fd0f5;--ni-soft:#13303d;--ni-line:#2c5d75;
  --shadow-1:none;--shadow-2:0 8px 24px rgba(0,0,0,.35);--scrim:rgba(0,0,0,.6);
}}
:root[data-theme="dark"]{
  --bg:#0f1114;--surface:#171a1f;--surface-2:#1f232a;--surface-3:#282d35;
  --ink:#eef0f3;--ink-2:#b4bac4;--ink-3:#8b929e;--line:#2a2f37;--line-2:#3a404a;
  --accent:#4cc3a3;--accent-ink:#06231c;--accent-soft:#16332c;--accent-text:#6fd6b9;
  --good:#5fd08f;--good-soft:#173324;--warn:#f0b357;--warn-soft:#3a2c12;--bad:#ff8a80;--bad-soft:#3d1c1a;
  --gA:#2f9e63;--gA-ink:#04170c;--gB:#5b9be6;--gB-ink:#061527;--gC:#8a919c;--gC-ink:#0f1114;
  --bar:#6ea8ec;--bar-weak:#36506f;
  --t0:#c3b3ff;--t0-soft:#29233f;--t0-line:#54479a;--t1:#ffab78;--t1-soft:#36241a;--t1-line:#80492a;--t2:#86b8f2;
  --ni:#7fd0f5;--ni-soft:#13303d;--ni-line:#2c5d75;
  --shadow-1:none;--shadow-2:0 8px 24px rgba(0,0,0,.35);--scrim:rgba(0,0,0,.6);
  color-scheme:dark;
}
:root[data-theme="light"]{color-scheme:light}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font:15px/1.5 var(--font);font-feature-settings:"cv11","ss01";min-height:100vh;overflow-x:hidden}
a{color:var(--accent-text)}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:6px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.num{font-variant-numeric:tabular-nums}
h1,h2,h3{font-family:var(--font-d);letter-spacing:-.015em;margin:0}

/* ---------- header & tabs ---------- */
.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:saturate(1.4) blur(10px);-webkit-backdrop-filter:saturate(1.4) blur(10px);border-bottom:1px solid var(--line)}
.bar{max-width:var(--maxw);margin:0 auto;padding:var(--s3) var(--s4) 0;display:flex;align-items:center;gap:var(--s3)}
.brand{display:flex;align-items:center;gap:var(--s2);flex:none}
.logo{width:32px;height:32px;border-radius:9px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;flex:none}
.brand h1{font-size:18px;font-weight:800;white-space:nowrap}
.health{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--ink-2);min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.spacer{flex:1}
.iconbtn{width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;cursor:pointer;flex:none;color:var(--ink)}
.iconbtn:hover{background:var(--surface-2)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--good);flex:none;display:inline-block}
.dot.warn{background:var(--warn)}.dot.bad{background:var(--bad)}
.tabs{max-width:var(--maxw);margin:0 auto;padding:var(--s2) var(--s4) 0;display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;border:0;background:none;padding:10px 12px 12px;cursor:pointer;color:var(--ink-2);font-weight:500;font-size:14px;border-bottom:2px solid transparent;display:inline-flex;align-items:center;gap:6px;border-radius:8px 8px 0 0}
.tab:hover{color:var(--ink);background:var(--surface-2)}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent);font-weight:600}
.tab .n{font-size:12px;background:var(--surface-3);color:var(--ink-2);border-radius:999px;padding:0 7px;line-height:20px;font-variant-numeric:tabular-nums}
.tab .n.hot{background:var(--accent-soft);color:var(--accent-text)}
.tabsep{width:1px;background:var(--line);margin:10px 6px 14px;flex:none}

main{max-width:var(--maxw);margin:0 auto;padding:var(--s6) var(--s4) var(--s12)}
.pagehead{display:flex;flex-wrap:wrap;align-items:flex-end;gap:var(--s2) var(--s4);margin-bottom:var(--s5)}
.pagehead h2{font-size:26px;font-weight:800;line-height:1.2}
.pagehead p{margin:var(--s1) 0 0;color:var(--ink-2);max-width:760px}
.eyebrow{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3)}
.section{margin-top:var(--s10);scroll-margin-top:120px}
#list{scroll-margin-top:120px}
.sechead{display:flex;align-items:baseline;justify-content:space-between;gap:var(--s3);margin-bottom:var(--s3)}
.sechead h3{font-size:18px;font-weight:700}
.sechead .sub{color:var(--ink-3);font-size:13px}
.link{background:none;border:0;padding:4px 0;color:var(--accent-text);font-weight:600;cursor:pointer;white-space:nowrap;font-size:14px;text-decoration:none}
.link:hover{text-decoration:underline}

/* ---------- KPI tiles ---------- */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:var(--s3)}
.kpi.hot{border-color:var(--t1-line);background:linear-gradient(135deg,var(--t0-soft),var(--t1-soft))}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-m);padding:var(--s4);box-shadow:var(--shadow-1);min-width:0}
.kpi .k{font-size:13px;color:var(--ink-2);font-weight:500}
.kpi .v{font-family:var(--font-d);font-size:30px;font-weight:800;line-height:1.15;margin-top:var(--s1);font-variant-numeric:tabular-nums}
.kpi .s{font-size:13px;color:var(--ink-3);margin-top:2px}
.rgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:var(--s3);margin-top:var(--s3)}
.rtile{text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-m);padding:var(--s4);cursor:pointer;display:flex;flex-direction:column;gap:var(--s1);box-shadow:var(--shadow-1);min-width:0}
.rtile:hover{border-color:var(--line-2);box-shadow:var(--shadow-2)}
.rtile .t{font-weight:700;font-family:var(--font-d)}
.rtile .c{font-size:13px;color:var(--ink-2)}
.rtile .best{margin-top:var(--s2);font-size:13px;color:var(--ink-3)}
.rtile .best b{color:var(--ink);font-size:15px}
@media (max-width:900px){.kpis,.rgrid{grid-template-columns:repeat(2,minmax(0,1fr))}}

/* ---------- notices ---------- */
.note{display:flex;gap:var(--s3);align-items:flex-start;padding:var(--s3) var(--s4);border-radius:var(--r-m);background:var(--surface);border:1px solid var(--line);font-size:14px;color:var(--ink-2)}
.note.warn{background:var(--warn-soft);border-color:transparent;color:var(--ink)}
.note.bad{background:var(--bad-soft);border-color:transparent;color:var(--ink)}
.note.info{background:var(--accent-soft);border-color:transparent;color:var(--ink)}
.note b{color:var(--ink)}
.note .ic{flex:none;margin-top:1px}

/* ---------- controls ---------- */
.controls{display:flex;flex-wrap:wrap;gap:var(--s2);align-items:center;margin:var(--s4) 0}
.field{position:relative;flex:1 1 240px;min-width:0}
.field svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--ink-3);pointer-events:none}
.input,.select{height:40px;border:1px solid var(--line-2);background:var(--surface);border-radius:10px;padding:0 12px;min-width:0;max-width:100%}
.input{width:100%;padding-left:36px}
.select{padding-right:8px;cursor:pointer}
.input:focus,.select:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.toggle{display:inline-flex;align-items:center;gap:8px;height:40px;padding:0 12px;border:1px solid var(--line-2);border-radius:10px;background:var(--surface);cursor:pointer;font-size:14px;white-space:nowrap;user-select:none}
.toggle input{accent-color:var(--accent);width:16px;height:16px;margin:0}
.toggle:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
.seg{display:inline-flex;border:1px solid var(--line-2);border-radius:10px;overflow:hidden;background:var(--surface);height:40px}
.seg button{border:0;background:none;padding:0 14px;cursor:pointer;color:var(--ink-2);font-weight:500;font-size:14px;display:inline-flex;align-items:center;gap:6px}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.resultline{display:flex;justify-content:space-between;align-items:center;gap:var(--s3);color:var(--ink-3);font-size:13px;margin-bottom:var(--s3);flex-wrap:wrap}
.clear{background:none;border:0;color:var(--accent-text);cursor:pointer;font-weight:600;padding:0;font-size:13px}

/* ---------- grade / chips ---------- */
.rating{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:4px 10px 4px 8px;font-weight:700;font-size:13px;line-height:1.15;background:var(--surface);color:var(--ink);border:1px solid var(--line);box-shadow:var(--shadow-1);white-space:nowrap;max-width:100%}
.rating .e{font-size:14px;line-height:1}
.rating .sc{font-weight:600;color:var(--ink-3);font-variant-numeric:tabular-nums;font-size:12px;padding-left:7px;margin-left:1px;border-left:1px solid var(--line)}
.rating.once{background:var(--t0-soft);color:var(--t0);border-color:var(--t0-line)}
.rating.once .sc{color:var(--t0);border-color:var(--t0-line)}
.rating.exceptional{background:var(--t1-soft);color:var(--t1);border-color:var(--t1-line)}
.rating.exceptional .sc{color:var(--t1);border-color:var(--t1-line)}
.rating.great{color:var(--t2)}
.rating.sm{font-size:12px;padding:3px 8px 3px 6px}
.card.tier-once,.mini.tier-once{border-color:var(--t0-line);box-shadow:0 0 0 1px var(--t0-line),var(--shadow-2)}
.card.tier-exceptional,.mini.tier-exceptional{border-color:var(--t1-line);box-shadow:0 0 0 1px var(--t1-line),var(--shadow-1)}
.card.tier-once::before,.card.tier-exceptional::before{content:"";position:absolute;left:0;right:0;top:0;height:4px;z-index:3;background:var(--t0)}
.card.tier-exceptional::before{background:var(--t1)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:-4px 0 var(--s4)}
.chip{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 12px;border-radius:999px;border:1px solid var(--line-2);background:var(--surface);cursor:pointer;font-size:13px;font-weight:500;color:var(--ink-2);white-space:nowrap}
.chip .c{font-variant-numeric:tabular-nums;color:var(--ink-3);font-size:12px}
.chip[aria-pressed="true"]{border-color:var(--ink);background:var(--ink);color:var(--bg)}
.chip[aria-pressed="true"] .c{color:inherit;opacity:.75}
.chip[disabled]{opacity:.45;cursor:default}
.pill.soon{background:var(--t1-soft);color:var(--t1)}
.ni{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:3px 9px;font-size:12px;font-weight:600;line-height:1.2;white-space:nowrap;background:var(--ni-soft);color:var(--ni);border:1px solid var(--ni-line)}
.badges{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.media .badges{position:absolute;left:10px;top:10px;right:56px}
.media .badges .rating{position:static;max-width:100%}
.ask{background:var(--ni-soft);border:1px solid var(--ni-line);border-radius:var(--r-m);padding:var(--s4)}
.ask h3{color:var(--ni)!important;margin-bottom:var(--s2)!important}
.ask ol{margin:0 0 var(--s3);padding-left:20px;display:flex;flex-direction:column;gap:6px;font-size:14px;color:var(--ink)}
.ask p{margin:var(--s3) 0 0;font-size:13px;color:var(--ink-2)}
.ask .btn{height:40px}
.mini .q{font-size:12.5px;color:var(--ni);display:flex;gap:6px;align-items:flex-start;overflow-wrap:anywhere}
.toggle.wide{white-space:normal}
.pill{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:2px 9px;font-size:12px;font-weight:600;line-height:18px;white-space:nowrap}
.pill.new{background:var(--accent);color:var(--accent-ink)}
.pill.good{background:var(--good-soft);color:var(--good)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.muted{background:var(--surface-3);color:var(--ink-2)}
.utils{display:flex;flex-wrap:wrap;gap:6px}
.u{display:inline-flex;align-items:center;gap:4px;font-size:12px;border-radius:6px;padding:2px 7px;border:1px solid var(--line);color:var(--ink-2);white-space:nowrap}
.u .st{font-weight:700}
.u.yes{border-color:transparent;background:var(--good-soft);color:var(--good)}
.u.no{border-color:transparent;background:var(--bad-soft);color:var(--bad)}
.u.unknown{border-style:dashed;color:var(--warn)}
.u.assumed{color:var(--ink-3)}

/* ---------- cards ---------- */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:var(--s4)}
.card{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-l);overflow:hidden;display:flex;flex-direction:column;box-shadow:var(--shadow-1);cursor:pointer;transition:box-shadow .15s,border-color .15s,transform .15s}
.card:hover{box-shadow:var(--shadow-2);border-color:var(--line-2)}
.media{position:relative;aspect-ratio:16/9;background:var(--surface-2);overflow:hidden}
.media img{width:100%;height:100%;object-fit:cover;display:block}
.card .media:has(> .ph:not([hidden])){aspect-ratio:auto;height:112px}
.card .media:has(> .ph:not([hidden])) .ph div{flex-direction:row}
.ph{position:absolute;inset:0;display:grid;place-items:center;color:var(--ink-3);background:linear-gradient(135deg,var(--surface-2),var(--surface-3))}
.ph div{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;font-weight:500}
.media > .rating{position:absolute;left:10px;top:10px;max-width:calc(100% - 64px)}
.media .pill.new{position:absolute;left:10px;bottom:10px}
.star{position:absolute;top:8px;right:8px;width:36px;height:36px;border-radius:50%;border:0;background:color-mix(in srgb,var(--surface) 92%,transparent);color:var(--ink-2);display:grid;place-items:center;cursor:pointer;box-shadow:var(--shadow-1);z-index:2}
.star:hover{color:var(--ink)}
.star[aria-pressed="true"]{color:#c98a00}
.star[aria-pressed="true"] svg{fill:currentColor}
.cbody{padding:var(--s4);display:flex;flex-direction:column;gap:var(--s2);flex:1;min-width:0}
.keynum{display:flex;align-items:baseline;flex-wrap:wrap;gap:2px 8px}
.keynum .big{font-family:var(--font-d);font-weight:800;font-size:24px;line-height:1.15;font-variant-numeric:tabular-nums}
.keynum .big.pos{color:var(--good)}
.keynum .unit{color:var(--ink-2);font-size:14px;font-weight:500}
.subnums{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:13px;color:var(--ink-2)}
.subnums b{color:var(--ink);font-weight:600}
.ctitle{font:600 15px/1.35 var(--font);letter-spacing:0;margin:0;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ctitle a{color:var(--ink);text-decoration:none}
.ctitle a:hover{text-decoration:underline}
.loc{font-size:13px;color:var(--ink-3);overflow-wrap:anywhere}
.why{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:3px;font-size:13px;color:var(--ink-2)}
.why li{display:flex;gap:6px;align-items:flex-start;overflow-wrap:anywhere}
.why li::before{content:"";flex:none;width:6px;height:6px;border-radius:50%;background:var(--accent);margin-top:7px}
.cfoot{display:flex;justify-content:space-between;align-items:center;gap:var(--s2);margin-top:auto;padding-top:var(--s3);border-top:1px solid var(--line);font-size:13px;color:var(--ink-3)}
.adlink{font-weight:600;text-decoration:none;white-space:nowrap}
.adlink:hover{text-decoration:underline}
.more{display:flex;margin:var(--s6) auto 0;height:44px;align-items:center;padding:0 var(--s5);border-radius:10px;border:1px solid var(--line-2);background:var(--surface);cursor:pointer;font-weight:600}
.more:hover{background:var(--surface-2)}

/* compact (Today) */
.minis{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,340px),1fr));gap:var(--s3)}
.mini .ph span{display:none}
.mini{position:relative;display:grid;grid-template-columns:112px minmax(0,1fr);gap:var(--s3);background:var(--surface);border:1px solid var(--line);border-radius:var(--r-m);padding:var(--s2);cursor:pointer;box-shadow:var(--shadow-1);min-width:0}
.mini:hover{box-shadow:var(--shadow-2);border-color:var(--line-2)}
.mini .media{aspect-ratio:auto;height:100%;min-height:104px;border-radius:8px}
.mini .mb{display:flex;flex-direction:column;gap:4px;min-width:0;padding:2px 36px 2px 0}
.mini .keynum .big{font-size:20px}
.mini .ctitle{font-size:14px;-webkit-line-clamp:1}
.mini .why{font-size:12.5px}
.mini .star{top:6px;right:6px;width:32px;height:32px;background:transparent;box-shadow:none}

/* ---------- table ---------- */
.tablewrap{position:relative;overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-m);box-shadow:var(--shadow-1)}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:10px 12px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
tbody tr:last-child td{border-bottom:0}
th{font-size:12px;font-weight:600;color:var(--ink-3);text-transform:uppercase;letter-spacing:.04em;white-space:nowrap;background:var(--surface);position:sticky;top:0}
th button{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:4px}
th button:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:4px}
th[aria-sort] button::after{content:"↕";opacity:.35;font-size:11px}

<script>

/* ================= utilities ================= */

const $ = (s, el = document) => el.querySelector(s);

const nf0 = new Intl.NumberFormat("en-GB", {maximumFractionDigits:0});

const isNum = v => typeof v === "number" && isFinite(v);

const eur = v => isNum(v) ? nf0.format(v) + " €" : "—";
const pctNum = v => { if (isNum(v)) return v; if (typeof v !== "string") return null; const n = parseFloat(v.replace("−","-")); return isFinite(n) ? n : null; };
const TIERS = [
  {tier:"once", emoji:"💎", label:"Once-in-a-lifetime", rank:0},
  {tier:"exceptional", emoji:"🔥", label:"Exceptional deal", rank:1},
  {tier:"great", emoji:"⭐", label:"Great deal", rank:2},
  {tier:"good", emoji:"👍", label:"Good deal", rank:3},
  {tier:"watch", emoji:"👀", label:"Worth a look", rank:4}];
function ratingOf(i){ const r = i && i.rating; if (r && isNum(r.rank)) { const t = TIERS[r.rank] || {}; return {tier:String(r.tier || t.tier || "watch").replace(/[^a-z]/g, ""), emoji:r.emoji || t.emoji || "", label:r.label || t.label || "Rated", rank:r.rank}; }
  const s = i?.score ?? 0; return TIERS[s >= 75 ? 2 : s >= 55 ? 3 : 4]; }

/* ================= researcher presentation config ================= */
const M = (i, label) => { const m = i.metrics || {}; if (label in m) return m[label];
  const k = Object.keys(m).find(x => x.toLowerCase().startsWith(label.toLowerCase())); return k ? m[k] : null; };
const mo = v => isNum(v) ? nf1.format(v) + " months" : null;

const RCFG = {
  airbnb: {
    short:"Airbnb",
    plain:"Skopje flats you could rent long-term and re-list on Airbnb / Booking. The big green number is our estimate of what you keep each month after rent, cleaning, bills and platform fees.",

      return {big: isNum(p) ? (p > 0 ? "+" : "") + eur(p) : "—", pos: p > 0, unit:"/ month est. profit",

    checklist:[

function filtered(R){

  const by = {best:bestSort, soon:(a,b) => { const x = daysUntil(a), y = daysUntil(b); return (x == null || x < 0 ? 1e9 : x) - (y == null || y < 0 ? 1e9 : y); }, value:(a,b) => (b.sort_value ?? -1e15) - (a.sort_value ?? -1e15),

function drawTable(R, items, list){

    <tbody>${rows.slice(0, lim).map(i => `<tr class="row" data-open="${esc(i.id)}" data-r="${esc(i._r)}">${cols.map(x => `<td class="${x.num ? "n" : ""} ${x.hideM ? "hide-m" : ""}">${x.raw ? x.f(i) : x.f(x.v(i), i)}</td>`).join("")}</tr>`).join("")}</tbody></table></div>` +

/* ================= map (lazy Leaflet) ================= */
let leafletP = null;
function loadLeaflet(){ if (window.L) return Promise.resolve(); if (leafletP) return leafletP;
  leafletP = new Promise((res, rej) => { const l = document.createElement("link"); l.rel = "stylesheet"; l.href = "https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"; document.head.appendChild(l);
    const s = document.createElement("script"); s.src = "https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"; s.onload = res; s.onerror = () => { leafletP = null; rej(); }; document.head.appendChild(s); });
  return leafletP; }
const tiles = () => L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {maxZoom:19, attribution:'&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'});
const gcol = i => getComputedStyle(document.documentElement).getPropertyValue(["--t0","--t1","--t2","--good","--gC"][rankOf(i)] || "--gC").trim();
function drawMap(items, list){
  const pts = items.filter(i => isNum(i.lat) && isNum(i.lng));
  if (!pts.length) { list.innerHTML = `<div class="empty"><h3>No map positions yet</h3><p>None of these ${nf0.format(items.length)} ads include GPS coordinates (they're added when the scraper opens an ad's detail page). Use the cards or table view for now.</p></div>`; return; }
  list.innerHTML = `<div id="map" role="region" aria-label="Map of deals"></div><p class="resultline" style="margin-top:8px">${pts.length} of ${items.length} deals have a map position. Pin colour = rating (purple 💎, orange 🔥, blue ⭐, green 👍, grey 👀).</p>`;
  loadLeaflet().then(() => { if (!$("#map")) return;
    mapObj = L.map("map"); tiles().addTo(mapObj);
    pts.forEach(i => L.circleMarker([i.lat, i.lng], {radius:7 + (i.score || 0) / 20, color:gcol(i), weight:2, fillOpacity:.55}).addTo(mapObj)
      .bindPopup(`<b>${esc(ratingOf(i).emoji + " " + ratingOf(i).label)} · ${i.score ?? ""}</b>${needsInfo(i) ? " · ❓ Needs info" : ""} — ${esc(cfg(i._r).key(i).big)}<br><a href="${dealHref(i)}">${esc(i.title || "Untitled")}</a>`));
    mapObj.fitBounds(L.latLngBounds(pts.map(i => [i.lat, i.lng])).pad(0.15), {maxZoom:15});
  }).catch(() => { list.innerHTML = `<div class="empty"><p>The map library couldn't load. Check your connection.</p></div>`; });
}

function toggleStar(id, r){

/* ================= DRAWER ================= */
let openId = null, lastFocus = null, pushed = false;
function findItem(id, r){ const R = DATA.researchers.find(x => x.key === r); return R?.items.find(x => x.id === id) || ITEMS.get(id) || (shortlist[id] ? Object.assign({}, shortlist[id].item, {_r:shortlist[id].r, _gone:true}) : null); }
function fmtMetric(label, v){
  if (v == null || v === "") return "—";
  if (!isNum(v)) return String(v);
  if (/m²\)?$/.test(label) && !/€/.test(label)) return nf0.format(v) + " m²";
  if (/€\/m²/.test(label)) return fmtN(v) + " €";
  if (/months/i.test(label)) return nf1.format(v) + " months";
  if (/\(km\)/.test(label)) return nf1.format(v) + " km";
  if (/days/i.test(label)) return nf0.format(v) + " days";
  if (/year/i.test(label)) return String(v);
  if (/price|rent|revenue|cost|profit|cash|value|renovation|tax|offer|nightly/i.test(label)) return eur(v);
  return fmtN(v);
}
function paintDStar(id){ const b = $("#dStar"); if (!b) return; const on = !!shortlist[id]; b.setAttribute("aria-pressed", on); b.innerHTML = I.star + (on ? " Saved" : " Save"); }
function openDeal(id, r, push){
  if (!DATA) return; const i = findItem(id, r);
  if (!i) { if (push === false) setHash({}, false); return; }
  const c = cfg(i._r); const R = DATA.researchers.find(x => x.key === i._r);
  openId = id; if (!$("#drawer").classList.contains("on")) lastFocus = document.activeElement;
  if (push) { setHash({deal:id, in:i._r}, true); pushed = true; } else pushed = false;
  const m = i.metrics || {}; const used = new Set();
  const groups = c.groups.map(([title, labels]) => { const rows = labels.map(l => Object.keys(m).find(k => k === l || k.toLowerCase().startsWith(l.toLowerCase()))).filter(k => k && !used.has(k) && (used.add(k), true));
    return [title, rows]; }).filter(g => g[1].length);
  const rest = Object.keys(m).filter(k => !used.has(k)); if (rest.length) groups.push([groups.length ? "Other numbers" : "Numbers", rest]);
  const row = k => { const hl = c.highlight.some(h => k.toLowerCase().startsWith(h.toLowerCase())); const hint = Object.entries(HINT).find(([h]) => k.toLowerCase().startsWith(h.toLowerCase()))?.[1];
    return `<div class="mrow${hl ? " hl" : ""}"><span class="ml">${esc(k)}</span><span class="mv">${esc(fmtMetric(k, m[k]))}</span>${hint ? `<span class="mh">${esc(hint)}</span>` : ""}</div>`; };

  $("#dBody").innerHTML = `

    <div class="dsec">
      <div class="dmeta">${ratingBadge(i)}${isNum(i.score) ? `<span class="pill muted">Score ${i.score} / 100</span>` : ""}${i._gone ? `<span class="pill warn">Not in latest results</span>` : ""}${niBadge(i)}</div>
      <h2 class="dtitle" id="dTitle">${esc(i.title || "Untitled ad")}</h2>

        <button type="button" class="btn" id="dStar" data-id="${esc(id)}" aria-pressed="false"></button></div></div></div>
    ${qs.length ? `<div class="dsec"><div class="ask" role="region" aria-labelledby="askH"><h3 id="askH">❓ Ask the seller</h3>
      <ol>${qs.map(q => `<li>${esc(q)}</li>`).join("")}</ol>
      <button type="button" class="btn" id="copyQ">Copy questions</button> <span id="copyQs" class="also" aria-live="polite"></span>

    ${(i.reasons || []).length ? `<div class="dsec"><h3>Why it's a deal</h3><ul class="reasons">${i.reasons.map(x => `<li>${I.check}<span>${esc(x)}</span></li>`).join("")}</ul></div>` : ""}
    <div class="dsec"><h3>Key facts</h3><dl class="facts">
      <div><dt>${i._r === "auctions" ? "Starting price" : "Asking price"}</dt><dd>${esc(eur(i.price))}</dd></div>
      <div><dt>Price per m²</dt><dd>${isNum(i.ppm2) ? esc(fmtN(i.ppm2)) + " €" : "—"}</dd></div>
      <div><dt>Size</dt><dd>${isNum(i.area) ? nf0.format(i.area) + " m²" : "—"}${isNum(i.rooms) ? " · " + nf1.format(i.rooms) + " rooms" : ""}</dd></div>
      <div><dt>Seller</dt><dd>${i._r === "auctions" ? "Bailiff (enforcement sale)" : i.agency ? "Agency" : "Private"}</dd></div>
      ${i.auction_date ? `<div><dt>Sale date</dt><dd>${esc(i.auction_date)}${countdown(i) ? ` · ${esc(countdown(i))}` : ""}</dd></div>` : `<div><dt>Posted</dt><dd>${esc(i.posted || "—")}</dd></div>`}
      <div><dt>First spotted by us</dt><dd>${esc(i.first_seen || "—")}</dd></div>
    </dl>${!i.has_details && i._r !== "auctions" ? `<p class="also" style="margin:8px 0 0">The full ad page hasn't been read yet — some details (exact location, utilities) may fill in after the next run.</p>` : ""}</div>
    ${groups.map(([t, ks]) => `<div class="dsec" style="padding-top:12px"><div class="mgroup"><h4>${esc(t)}</h4>${ks.map(row).join("")}</div></div>`).join("").replace('<div class="dsec" style="padding-top:12px">', '<div class="dsec"><h3>The numbers</h3>')}
    <div class="dsec"><h3>Utilities</h3><div class="mgroup">${UTIL.map(([k,l]) => { const s = u[k] || "unknown"; return `<div class="urow ${esc(s)}"><span class="ui" aria-hidden="true">${UTIL_MARK[s] || "?"}</span><div><b>${esc(l)}</b><div class="ut">${esc(UTIL_TXT[s] || s)}</div></div></div>`; }).join("")}</div></div>
    ${hasGeo ? `<div class="dsec"><h3>On the map</h3><div class="minimap" id="minimap" role="img" aria-label="Map showing the property location"></div></div>` : ""}
    <div class="dsec"><h3>Before you buy</h3><ul class="check">${c.checklist.map(([t,h], n) => `<li><label><input type="checkbox" data-ck="${n}" ${ck[n] ? "checked" : ""}><span>${esc(t)}<span class="ch">${esc(h)}</span></span></label></li>`).join("")}</ul>
      <p class="also" style="margin:8px 0 0">Ticks are saved in this browser. All numbers are estimates from the ad text — verify before paying any deposit.</p></div>
    ${also.length ? `<div class="dsec"><p class="also">Also flagged by: <b>${esc(also.join(", "))}</b></p></div>` : ""}
  `;
  paintDStar(id);
  const cq = $("#copyQ"); if (cq) cq.onclick = async () => { const txt = (i.title ? i.title + "\n" : "") + (safeUrl(i.url) ? i.url + "\n" : "") + qs.map((q, n) => `${n + 1}. ${q}`).join("\n");
    let ok = false; try { await navigator.clipboard.writeText(txt); ok = true; } catch {}
    if (!ok) { try { const ta = document.createElement("textarea"); ta.value = txt; ta.style.position = "fixed"; ta.style.opacity = "0"; document.body.appendChild(ta); ta.select(); ok = document.execCommand("copy"); ta.remove(); } catch {} }
    $("#copyQs").textContent = ok ? "Copied — paste into Viber or SMS." : "Couldn't copy — select the list above."; };
  $("#dStar").onclick = () => toggleStar(id, i._r);
  $$("[data-ck]", $("#dBody")).forEach(cb => cb.onchange = () => { const a = checks[id] || []; a[+cb.dataset.ck] = cb.checked; checks[id] = a; store.set("mkdeal.checks", checks); });
  const sc = $("#scrim"), dr = $("#drawer"); sc.hidden = false; dr.hidden = false;
  requestAnimationFrame(() => { sc.classList.add("on"); dr.classList.add("on"); });
  document.body.style.overflow = "hidden"; $("#dBody").scrollTop = 0; $("#dClose").focus({preventScroll:true});
  if (miniMap) { miniMap.remove(); miniMap = null; }
  if (hasGeo) loadLeaflet().then(() => { const el = $("#minimap"); if (!el || openId !== id) return; miniMap = L.map(el, {scrollWheelZoom:false}).setView([i.lat, i.lng], 15); tiles().addTo(miniMap);
    L.circleMarker([i.lat, i.lng], {radius:9, color:gcol(i), weight:3, fillOpacity:.6}).addTo(miniMap); setTimeout(() => miniMap && miniMap.invalidateSize(), 250); }).catch(() => {});
}
function closeDeal(fromUser){
  if (!openId) return; openId = null;
  const sc = $("#scrim"), dr = $("#drawer"); sc.classList.remove("on"); dr.classList.remove("on");
  setTimeout(() => { if (!openId) { sc.hidden = true; dr.hidden = true; if (miniMap) { miniMap.remove(); miniMap = null; } } }, 230);
  document.body.style.overflow = "";
  if (fromUser) { if (pushed) { pushed = false; history.back(); } else setHash({}, false); }
  if (lastFocus && document.contains(lastFocus)) lastFocus.focus({preventScroll:true});
}
$("#dClose").onclick = () => closeDeal(true);
$("#scrim").onclick = () => closeDeal(true);
$("#dShare").onclick = async () => { const url = location.href; try { await navigator.clipboard.writeText(url); $("#dShare").title = "Link copied"; $("#dShare").setAttribute("aria-label", "Link copied"); } catch { prompt("Copy this link:", url); } };
document.addEventListener("keydown", e => {
  if (!openId) return;
  if (e.key === "Escape") { e.preventDefault(); closeDeal(true); return; }
  if (e.key === "Tab") { const f = $$('#drawer a[href],#drawer button,#drawer input,#drawer [tabindex]:not([tabindex="-1"])').filter(x => x.offsetParent !== null); if (!f.length) return;
    const first = f[0], last = f[f.length - 1];
    if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); } else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); } }
});

/* ================= MARKET ================= */
const DEAL_TXT = {sale:"For sale", rent:"For rent (per month)", short_term:"Short-term rent", wanted:"Wanted (buyer ads)"};
const KIND_PL = {apartment:"Flats", house:"Houses", land:"Land", weekend_house:"Weekend houses"};
const NATIONAL = /цела македонија|all of macedonia|macedonia/i;
let mkState = {chart:"apartment|sale", kind:"", deal:"", q:"", sort:"samples", dir:-1};
function renderMarket(){
  const rows = DATA.market.filter(r => r && r.city && isNum(r.median_ppm2));
  const sets = [...new Set(rows.map(r => r.kind + "|" + r.deal))].filter(s => rows.filter(r => r.kind + "|" + r.deal === s && !NATIONAL.test(r.city)).length >= 2);
  const order = ["apartment|sale","house|sale","land|sale","apartment|rent","weekend_house|sale","house|rent"];
  sets.sort((a,b) => (order.indexOf(a) + 1 || 99) - (order.indexOf(b) + 1 || 99));
  if (!sets.includes(mkState.chart)) mkState.chart = sets[0] || "";
  const kinds = [...new Set(rows.map(r => r.kind))], deals = [...new Set(rows.map(r => r.deal))];
  const lab = s => { const [k,d] = s.split("|"); return `${KIND_PL[k] || k} — ${(DEAL_TXT[d] || d).toLowerCase()}`; };
  $("#main").innerHTML = `
    <div class="pagehead"><div><div class="eyebrow">Yardstick</div><h2>Market prices</h2>
      <p>Median asking price per m² from every listing seen recently. This is the benchmark the researchers use to decide what's “under market”. Asking prices are usually above final sale prices.</p></div></div>
    ${sets.length ? `<figure class="chartcard" style="margin:0">
      <div style="display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:12px">
        <h3 style="font-size:17px" id="chartTitle">Median € per m² by city</h3>
        <label><span class="sr">Choose property type</span><select class="select" id="mchart">${sets.map(s => `<option value="${esc(s)}" ${s === mkState.chart ? "selected" : ""}>${esc(lab(s))}</option>`).join("")}</select></label></div>
      <div class="chart" id="chart"></div>
      <div class="legend" id="legend"></div>
    </figure>` : ""}
    <section class="section"><div class="sechead"><h3>All medians</h3><span class="sub" id="mcount"></span></div>
      <div class="controls">
        <label class="field"><span class="sr">Filter by city</span>${I.search}<input class="input" type="search" id="mq" placeholder="Filter city…" value="${esc(mkState.q)}"></label>
        <label class="sr" for="mkind">Type</label><select class="select" id="mkind"><option value="">All types</option>${kinds.map(k => `<option value="${esc(k)}" ${k === mkState.kind ? "selected" : ""}>${esc(KIND_PL[k] || k)}</option>`).join("")}</select>
        <label class="sr" for="mdeal">Deal</label><select class="select" id="mdeal"><option value="">All deal types</option>${deals.map(k => `<option value="${esc(k)}" ${k === mkState.deal ? "selected" : ""}>${esc(DEAL_TXT[k] || k)}</option>`).join("")}</select>
      </div><div id="mtable"></div></section>`;
  if ($("#mchart")) { $("#mchart").onchange = e => { mkState.chart = e.target.value; drawChart(rows, lab); }; drawChart(rows, lab); }
  $("#mq").oninput = e => { mkState.q = e.target.value; drawMTable(rows); };
  $("#mkind").onchange = e => { mkState.kind = e.target.value; drawMTable(rows); };
  $("#mdeal").onchange = e => { mkState.deal = e.target.value; drawMTable(rows); };
  drawMTable(rows);
}
function niceStep(max, cnt = 5){ const raw = max / cnt; const p = Math.pow(10, Math.floor(Math.log10(raw))); const n = raw / p; return (n < 1.5 ? 1 : n < 3 ? 2 : n < 7 ? 5 : 10) * p; }
function drawChart(rows, lab){
  const [k, d] = mkState.chart.split("|");
  const set = rows.filter(r => r.kind === k && r.deal === d);
  const nat = set.find(r => NATIONAL.test(r.city));
  const data = set.filter(r => r !== nat).sort((a,b) => b.median_ppm2 - a.median_ppm2).slice(0, 20);
  const unit = d === "rent" ? "€ per m² per month" : "€ per m²";
  $("#chartTitle").textContent = `${lab(mkState.chart)}: median ${unit}`;
  const el = $("#chart"); const W = Math.max(300, Math.min(el.clientWidth || 700, 1100));
  const narrow = W < 520; const LW = narrow ? 84 : 150, RW = narrow ? 62 : 130, rowH = 30, top = 8, axisH = 44;
  const max = Math.max(...data.map(r => r.median_ppm2), nat ? nat.median_ppm2 : 0) || 1;
  const step = niceStep(max, narrow ? 3 : 5); const xmax = Math.ceil(max / step) * step;
  const PW = W - LW - RW; const x = v => LW + (v / xmax) * PW; const H = top + data.length * rowH + axisH;
  const dec = xmax < 50 ? 1 : 0; const f = v => (dec ? nf1 : nf0).format(v);
  const ticks = []; for (let t = 0; t <= xmax + 1e-9; t += step) ticks.push(t);
  const trunc = (s, n) => s.length > n ? s.slice(0, n - 1) + "…" : s;
  let svg = `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img" aria-labelledby="chartTitle chartDesc"><desc id="chartDesc">${esc(data.map(r => `${r.city}: ${f(r.median_ppm2)} (${r.samples} listings)`).join("; "))}${nat ? esc(`. National median ${f(nat.median_ppm2)}.`) : ""}</desc>
    <g class="grid">${ticks.map(t => `<line x1="${x(t)}" x2="${x(t)}" y1="${top}" y2="${top + data.length * rowH}"/>`).join("")}</g>`;
  let vals = "";
  data.forEach((r, n) => { const y = top + n * rowH; const weak = r.samples < 20; const bw = Math.max(2, x(r.median_ppm2) - LW);
    svg += `<text class="lbl" x="${LW - 8}" y="${y + rowH / 2 + 4}" text-anchor="end"><title>${esc(r.city)}</title>${esc(trunc(r.city, narrow ? 11 : 18))}</text>
      <rect class="bar${weak ? " weak" : ""}" x="${LW}" y="${y + 6}" width="${bw}" height="${rowH - 12}" rx="3"><title>${esc(r.city)}: ${f(r.median_ppm2)} ${unit} from ${r.samples} listings</title></rect>
`; vals += `<text class="val" x="${LW + bw + 6}" y="${y + rowH / 2 + 4}">${f(r.median_ppm2)} €<tspan class="axt" dx="6">${narrow ? "" : "n=" + nf0.format(r.samples)}</tspan></text>`; });
  if (nat) svg += `<line class="ref" x1="${x(nat.median_ppm2)}" x2="${x(nat.median_ppm2)}" y1="${top - 4}" y2="${top + data.length * rowH + 2}"/>`;
  svg += vals;
  const ay = top + data.length * rowH;
  svg += ticks.map(t => `<text class="axt" x="${x(t)}" y="${ay + 16}" text-anchor="middle">${f(t)}</text>`).join("");
  svg += `<text class="axt" x="${LW + PW / 2}" y="${ay + 36}" text-anchor="middle">Median asking price, ${unit}</text></svg>`;
  el.innerHTML = svg;
  $("#legend").innerHTML = `<span><i class="sw"></i>20+ listings</span><span><i class="sw weak"></i>fewer than 20 listings (less reliable)</span>${nat ? `<span><i class="sw ref"></i>National median ${esc(f(nat.median_ppm2))} €</span>` : ""}`;
}
let chartRT; window.addEventListener("resize", () => { if (state.tab !== "market" || !$("#chart")) return; clearTimeout(chartRT); chartRT = setTimeout(() => drawChart(DATA.market.filter(r => r && r.city && isNum(r.median_ppm2)), s => { const [k,d] = s.split("|"); return `${KIND_PL[k] || k} — ${(DEAL_TXT[d] || d).toLowerCase()}`; }), 150); });
function drawMTable(rows){
  const q = mkState.q.trim().toLowerCase();
  let r = rows.filter(x => (!q || x.city.toLowerCase().includes(q)) && (!mkState.kind || x.kind === mkState.kind) && (!mkState.deal || x.deal === mkState.deal));
  const cols = [["kind","Type",x => KIND_PL[x.kind] || x.kind],["deal","Deal",x => DEAL_TXT[x.deal] || x.deal],["city","Location",x => x.city],["median_ppm2","Median €/m²",x => x.median_ppm2],["samples","Listings",x => x.samples]];
  const c = cols.find(x => x[0] === mkState.sort) || cols[4];
  r = [...r].sort((a,b) => { const va = c[2](a), vb = c[2](b); return (typeof va === "number" ? va - vb : String(va).localeCompare(String(vb))) * mkState.dir; });
  $("#mcount").textContent = `${r.length} rows`;
  $("#mtable").innerHTML = r.length ? `<div class="tablewrap"><table><caption class="sr">Median asking prices</caption><thead><tr>${cols.map(([id,h]) => { const num = id === "median_ppm2" || id === "samples";
      return `<th scope="col" class="${num ? "n" : ""} ${id === "deal" ? "hide-m" : ""}" aria-sort="${mkState.sort === id ? (mkState.dir > 0 ? "ascending" : "descending") : "none"}"><button type="button" data-ms="${id}">${h}</button></th>`; }).join("")}</tr></thead>
    <tbody>${r.map(x => `<tr${NATIONAL.test(x.city) ? ' style="font-weight:600"' : ""}><td>${esc(KIND_PL[x.kind] || x.kind)}<span class="loc" style="display:none"></span></td><td class="hide-m">${esc(DEAL_TXT[x.deal] || x.deal)}</td><td>${esc(x.city)}</td>
      <td class="n">${esc((x.median_ppm2 < 50 ? nf1 : nf0).format(x.median_ppm2))} €${x.deal === "rent" ? "<span style='color:var(--ink-3)'>/mo</span>" : ""}</td><td class="n">${nf0.format(x.samples ?? 0)}${(x.samples ?? 0) < 20 ? ` <span class="pill warn" title="Few listings — less reliable" style="font-size:11px;padding:0 6px">few</span>` : ""}</td></tr>`).join("")}</tbody></table></div>`
    : `<div class="empty"><p>No rows match.</p></div>`;
  $$("[data-ms]").forEach(b => b.onclick = () => { const id = b.dataset.ms; if (mkState.sort === id) mkState.dir = -mkState.dir; else { mkState.sort = id; mkState.dir = (id === "city" || id === "kind" || id === "deal") ? 1 : -1; } drawMTable(rows); $(`[data-ms="${id}"]`)?.focus(); });
}

/* ================= RUN LOG ================= */
function renderRuns(){
  const h = runHealth(); const runs = DATA.runs;
  const st = s => ({ok:"", running:"warn"}[s] ?? "bad");
  const fmt = iso => iso ? new Date(iso).toLocaleString("en-GB", {day:"numeric", month:"short", hour:"2-digit", minute:"2-digit"}) : "—";
  const dur = r => { if (!r.started_at || !r.finished_at) return "—"; const s = (Date.parse(r.finished_at) - Date.parse(r.started_at)) / 1000; return s < 90 ? Math.round(s) + " s" : Math.round(s / 60) + " min"; };
  $("#main").innerHTML = `
    <div class="pagehead"><div><div class="eyebrow">Behind the scenes</div><h2>Run log</h2>
      <p>The scraper runs twice a day. <b>blocked</b> means the website refused automated requests — the run stops rather than forcing its way in. <b>interrupted</b> means it was stopped part-way. Times are in your local time zone.</p></div></div>
    <div class="note ${h.cls === "bad" ? "bad" : h.cls === "warn" ? "warn" : "info"}" style="margin-bottom:16px"><span class="ic">${I.info}</span><div><b>${esc(h.text)}.</b> Data last generated ${esc(fmtDate(DATA.generated_at))} (${esc(relTime(DATA.generated_at))}). ${esc(nf0.format(DATA.listings_tracked || 0))} listings tracked in total.${h.detail ? `<br><span style="font-size:13px">${esc(String(h.detail).slice(0, 200))}</span>` : ""}</div></div>
    ${runs.length ? `<div class="tablewrap"><table><caption class="sr">Recent scraper runs</caption><thead><tr><th scope="col">Started</th><th scope="col">Status</th><th scope="col" class="n hide-m">Took</th><th scope="col" class="n">Pages</th><th scope="col" class="n hide-m">Ads read</th><th scope="col" class="n">New ads</th><th scope="col" class="n hide-m">Price changes</th><th scope="col" class="hide-m">Note</th></tr></thead><tbody>
    ${runs.map(r => `<tr><td style="white-space:nowrap">${esc(fmt(r.started_at))}</td><td><span class="status"><span class="dot ${st(r.status)}"></span>${esc(r.status || "—")}</span></td><td class="n hide-m">${dur(r)}</td>
      <td class="n">${r.pages ?? "—"}</td><td class="n hide-m">${r.details ?? "—"}</td><td class="n">${r.new_listings ?? "—"}</td><td class="n hide-m">${r.price_changes ?? "—"}</td><td class="hide-m" style="max-width:360px;overflow-wrap:anywhere;font-size:13px;color:var(--ink-2)">${esc(r.message || "")}</td></tr>`).join("")}
    </tbody></table></div>` : `<div class="empty"><p>No runs recorded yet.</p></div>`}`;
}
