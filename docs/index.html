<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MK Deal Finder</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
:root{
  --bg:#f6f5f2;--panel:#ffffff;--ink:#1d1d1b;--muted:#6b6a65;--line:#e4e2dc;
  --accent:#1f6f5c;--accent-ink:#ffffff;--warn:#b5651d;--bad:#b3261e;--good:#1f7a3f;
  --chip:#efede7;--shadow:0 1px 2px rgba(0,0,0,.05),0 4px 16px rgba(0,0,0,.04);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#141413;--panel:#1d1d1b;--ink:#ecebe6;--muted:#a19f97;--line:#33322e;
  --accent:#5cc4a5;--accent-ink:#0d1f1a;--warn:#e0a060;--bad:#f2766b;--good:#6fcf8e;--chip:#2a2926;--shadow:none}}
:root[data-theme="dark"]{
  --bg:#141413;--panel:#1d1d1b;--ink:#ecebe6;--muted:#a19f97;--line:#33322e;
  --accent:#5cc4a5;--accent-ink:#0d1f1a;--warn:#e0a060;--bad:#f2766b;--good:#6fcf8e;--chip:#2a2926;--shadow:none}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
a{color:inherit}
header{padding:20px 16px 0;max-width:1240px;margin:0 auto}
h1{font-size:22px;margin:0 0 2px;letter-spacing:-.01em}
.sub{color:var(--muted);font-size:13px}
.status{display:inline-flex;gap:6px;align-items:center}
.dot{width:8px;height:8px;border-radius:50%;background:var(--good);display:inline-block}
.dot.bad{background:var(--bad)}.dot.warn{background:var(--warn)}
nav{display:flex;gap:6px;overflow-x:auto;padding:16px 16px 0;max-width:1240px;margin:0 auto;scrollbar-width:none}
nav button{flex:none;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:999px;padding:8px 14px;font:inherit;cursor:pointer;white-space:nowrap}
nav button[aria-selected="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
nav .n{opacity:.7;margin-left:6px;font-variant-numeric:tabular-nums}
main{max-width:1240px;margin:0 auto;padding:12px 16px 48px}
.intro{color:var(--muted);margin:6px 0 14px;max-width:820px}
.controls{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:14px}
.controls input[type=search],.controls select{font:inherit;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:7px 10px;min-width:0}
.controls input[type=search]{flex:1 1 200px}
.controls label{display:inline-flex;gap:6px;align-items:center;color:var(--muted);font-size:14px;white-space:nowrap}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:var(--panel);color:var(--ink);padding:7px 12px;font:inherit;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--chip);font-weight:600}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:14px}
@media (max-width:420px){.grid{grid-template-columns:1fr}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);overflow:hidden;display:flex;flex-direction:column}
.card .img{aspect-ratio:16/9;background:var(--chip) center/cover no-repeat;position:relative}
.score{position:absolute;top:10px;left:10px;background:var(--panel);color:var(--ink);border-radius:8px;padding:3px 9px;font-weight:700;font-variant-numeric:tabular-nums;box-shadow:var(--shadow)}
.score.hi{background:var(--accent);color:var(--accent-ink)}
.tag{position:absolute;top:10px;right:10px;background:var(--warn);color:#fff;border-radius:6px;padding:2px 8px;font-size:12px;font-weight:600}
.body{padding:12px 14px 14px;display:flex;flex-direction:column;gap:8px;flex:1}
.title{font-weight:600;text-decoration:none;line-height:1.3}
.title:hover{text-decoration:underline}
.where{color:var(--muted);font-size:13px}
.price{font-size:18px;font-weight:700;font-variant-numeric:tabular-nums}
.price small{font-size:13px;color:var(--muted);font-weight:400;margin-left:6px}
dl{display:grid;grid-template-columns:1fr auto;gap:2px 12px;margin:0;font-size:13px}
dt{color:var(--muted)}dd{margin:0;text-align:right;font-variant-numeric:tabular-nums}
dd.pos{color:var(--good);font-weight:600}
ul.reasons{margin:0;padding-left:18px;font-size:13px}
ul.reasons li{margin:1px 0}
.util{display:flex;gap:6px;flex-wrap:wrap}
.u{font-size:12px;border-radius:6px;padding:2px 7px;background:var(--chip);color:var(--muted)}
.u.yes{color:var(--good)}.u.no{color:var(--bad)}.u.assumed{color:var(--ink)}
.foot{display:flex;justify-content:space-between;color:var(--muted);font-size:12px;margin-top:auto;padding-top:4px}
.empty{padding:40px 16px;text-align:center;color:var(--muted);background:var(--panel);border:1px dashed var(--line);border-radius:12px}
#map{height:min(70vh,640px);border-radius:12px;border:1px solid var(--line)}
table{width:100%;border-collapse:collapse;background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden;font-size:14px}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left}
th{color:var(--muted);font-weight:500;font-size:13px}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
.tablewrap{overflow-x:auto}
.more{display:block;margin:18px auto 0;font:inherit;padding:8px 16px;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--ink);cursor:pointer}
.theme{float:right;font:inherit;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:8px;padding:4px 10px;cursor:pointer}
</style>
</head>
<body>
<header>
  <button class="theme" id="theme" title="Toggle theme">◐</button>
  <h1>MK Deal Finder</h1>
  <div class="sub" id="meta">Loading…</div>
</header>
<nav id="tabs" role="tablist"></nav>
<main id="main"></main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
const store = {
  get(k, d){ try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
};
const $ = (s, el=document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const eur = n => n == null ? "—" : new Intl.NumberFormat("en-GB",{maximumFractionDigits:0}).format(n) + " €";
const KIND = {apartment:"Apartment", house:"House / villa", land:"Land", weekend_house:"Weekend house"};
const UTIL = {electricity:"⚡ Power", water:"💧 Water", road:"🛣 Road"};
const UTIL_TXT = {yes:"confirmed in ad", no:"ad says missing", assumed:"assumed (built property)", unknown:"not mentioned"};

let DATA, state = store.get("mkdeal.state", {tab:null, q:"", city:"", minScore:0, qualifiedOnly:true, newOnly:false, view:"cards", sort:"score"});
let shown = 60, map;

(function theme(){
  const t = store.get("mkdeal.theme", null);
  if (t) document.documentElement.dataset.theme = t;
  $("#theme").onclick = () => {
    const cur = document.documentElement.dataset.theme ||
      (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
    const next = cur === "dark" ? "light" : "dark";
    document.documentElement.dataset.theme = next; store.set("mkdeal.theme", next);
    if (map) render();
  };
})();

fetch("data.json?" + Date.now()).then(r => r.json()).then(d => { DATA = d; boot(); })
  .catch(() => { $("#meta").textContent = "No data yet — the first scheduled run will create it."; });

function boot(){
  const last = DATA.runs?.[0];
  const ok = last?.status === "ok";
  const when = new Date(DATA.generated_at);
  $("#meta").innerHTML = `<span class="status"><span class="dot ${ok ? "" : "bad"}"></span>
    Updated ${when.toLocaleString("en-GB",{dateStyle:"medium",timeStyle:"short"})}</span> ·
    ${DATA.listings_tracked.toLocaleString()} listings tracked` + (ok ? "" : ` · <b>last run: ${esc(last?.status)}</b>`);
  const tabs = [...DATA.researchers.map(r => ({key:r.key, label:r.title.split(" — ")[0], n:r.qualified})),
                {key:"market", label:"Market prices"}, {key:"runs", label:"Run log"}];
  if (!tabs.some(t => t.key === state.tab)) state.tab = tabs[0].key;
  $("#tabs").innerHTML = tabs.map(t => `<button role="tab" data-k="${t.key}" aria-selected="${t.key===state.tab}">
    ${esc(t.label)}${t.n != null ? `<span class="n">${t.n}</span>` : ""}</button>`).join("");
  $("#tabs").onclick = e => { const b = e.target.closest("button"); if (!b) return;
    state.tab = b.dataset.k; shown = 60; save();
    [...$("#tabs").children].forEach(x => x.setAttribute("aria-selected", x === b)); render(); };
  render();
}
function save(){ store.set("mkdeal.state", state); }

function render(){
  if (map) { map.remove(); map = null; }
  if (state.tab === "market") return renderMarket();
  if (state.tab === "runs") return renderRuns();
  const R = DATA.researchers.find(r => r.key === state.tab);
  const cities = [...new Set(R.items.map(i => i.city).filter(Boolean))].sort();
  const hasUnqualified = R.items.some(i => !i.qualified);
  $("#main").innerHTML = `
    <p class="intro"><b>${esc(R.title)}.</b> ${esc(R.description)}</p>
    <div class="controls">
      <input type="search" id="q" placeholder="Search title, area, street…" value="${esc(state.q)}">
      <select id="city"><option value="">All locations</option>${cities.map(c => `<option ${c===state.city?"selected":""}>${esc(c)}</option>`).join("")}</select>
      <select id="sort">
        <option value="score">Best score</option><option value="value">Biggest upside</option>
        <option value="new">Newest</option><option value="price">Lowest price</option></select>
      <label>Min score <input type="range" id="min" min="0" max="90" step="5" value="${state.minScore}"> <span id="minv">${state.minScore}</span></label>
      ${hasUnqualified ? `<label><input type="checkbox" id="qual" ${state.qualifiedOnly?"checked":""}> Utilities confirmed only</label>` : ""}
      <label><input type="checkbox" id="new" ${state.newOnly?"checked":""}> New in last 24h</label>
      <div class="seg" role="group" aria-label="View">
        <button data-v="cards" aria-pressed="${state.view==="cards"}">Cards</button>
        <button data-v="map" aria-pressed="${state.view==="map"}">Map</button></div>
    </div>
    <div id="list"></div>`;
  $("#sort").value = state.sort;
  const on = (id, ev, fn) => { const el = $(id); if (el) el.addEventListener(ev, fn); };
  on("#q","input", e => { state.q = e.target.value; shown = 60; save(); draw(R); });
  on("#city","change", e => { state.city = e.target.value; save(); draw(R); });
  on("#sort","change", e => { state.sort = e.target.value; save(); draw(R); });
  on("#min","input", e => { state.minScore = +e.target.value; $("#minv").textContent = e.target.value; save(); draw(R); });
  on("#qual","change", e => { state.qualifiedOnly = e.target.checked; save(); draw(R); });
  on("#new","change", e => { state.newOnly = e.target.checked; save(); draw(R); });
  $(".seg").onclick = e => { const b = e.target.closest("button"); if (!b) return; state.view = b.dataset.v; save();
    [...$(".seg").children].forEach(x => x.setAttribute("aria-pressed", x === b)); draw(R); };
  draw(R);
}

function filtered(R){
  const q = state.q.trim().toLowerCase();
  let items = R.items.filter(i =>
    i.score >= state.minScore &&
    (!state.city || i.city === state.city) &&
    (!state.newOnly || i.is_new) &&
    (!state.qualifiedOnly || i.qualified) &&
    (!q || [i.title, i.city, i.district, ...(i.reasons||[])].join(" ").toLowerCase().includes(q)));
  const by = {score:(a,b)=>b.score-a.score, value:(a,b)=>(b.sort_value||0)-(a.sort_value||0),
    new:(a,b)=>(b.first_seen||"").localeCompare(a.first_seen||""), price:(a,b)=>(a.price??1e12)-(b.price??1e12)};
  return items.sort(by[state.sort] || by.score);
}

function draw(R){
  const items = filtered(R), list = $("#list");
  if (map) { map.remove(); map = null; }
  if (!items.length) {
    list.innerHTML = `<div class="empty">No deals match these filters yet.${R.items.length ? " Try lowering the minimum score." : " Results appear after the next scheduled run."}</div>`;
    return;
  }
  if (state.view === "map") return drawMap(items, list);
  list.innerHTML = `<div class="grid">${items.slice(0, shown).map(card).join("")}</div>` +
    (items.length > shown ? `<button class="more" id="more">Show more (${items.length - shown} left)</button>` : "");
  const m = $("#more"); if (m) m.onclick = () => { shown += 60; draw(R); };
}

function card(i){
  const metrics = Object.entries(i.metrics || {}).filter(([,v]) => v !== null && v !== "" && v !== undefined);
  const where = [i.city, i.district].filter(Boolean).join(" · ");
  const util = i.utilities ? Object.entries(UTIL).map(([k, label]) =>
    `<span class="u ${i.utilities[k]}" title="${UTIL_TXT[i.utilities[k]]}">${label} ${i.utilities[k] === "yes" ? "✓" : i.utilities[k] === "no" ? "✗" : i.utilities[k] === "assumed" ? "~" : "?"}</span>`).join("") : "";
  const posVal = v => typeof v === "string" && /^\d+%$/.test(v) ? "pos" : "";
  return `<article class="card">
    <a class="img" href="${esc(i.url)}" target="_blank" rel="noopener" style="${i.image ? `background-image:url('${esc(i.image)}')` : ""}" aria-label="Open listing">
      <span class="score ${i.score >= 70 ? "hi" : ""}">${i.score}</span>
      ${i.is_new ? `<span class="tag">NEW</span>` : ""}
    </a>
    <div class="body">
      <a class="title" href="${esc(i.url)}" target="_blank" rel="noopener">${esc(i.title)}</a>
      <div class="where">${esc(KIND[i.kind] || i.kind)}${where ? " · " + esc(where) : ""}${i.area ? " · " + i.area + " m²" : ""}${i.agency ? " · agency" : ""}</div>
      <div class="price">${eur(i.price)}${i.ppm2 ? `<small>${i.ppm2.toLocaleString()} €/m²</small>` : ""}</div>
      ${i.reasons?.length ? `<ul class="reasons">${i.reasons.map(r => `<li>${esc(r)}</li>`).join("")}</ul>` : ""}
      <dl>${metrics.map(([k,v]) => `<dt>${esc(k)}</dt><dd class="${posVal(v)}">${typeof v === "number" && Math.abs(v) >= 1000 ? v.toLocaleString("en-GB") : esc(v)}</dd>`).join("")}</dl>
      <div class="util">${util}</div>
      <div class="foot"><span>Listed ${i.days_listed ?? "?"} days</span><span>${i.has_details ? "" : "details pending · "}first seen ${esc(i.first_seen)}</span></div>
    </div></article>`;
}

function drawMap(items, list){
  const pts = items.filter(i => i.lat && i.lng);
  list.innerHTML = `<div id="map"></div><p class="sub">${pts.length} of ${items.length} deals have GPS coordinates.</p>`;
  map = L.map("map");
  L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {maxZoom:19,
    attribution:'&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'}).addTo(map);
  if (!pts.length) { map.setView([41.6, 21.7], 8); return; }
  const accent = getComputedStyle(document.documentElement).getPropertyValue("--accent").trim();
  pts.forEach(i => L.circleMarker([i.lat, i.lng], {radius: 6 + i.score / 15, color: accent, weight: 2, fillOpacity: .35})
    .addTo(map).bindPopup(`<b>${i.score}</b> · <a href="${esc(i.url)}" target="_blank" rel="noopener">${esc(i.title)}</a><br>${eur(i.price)}<br>${esc((i.reasons||[])[0]||"")}`));
  map.fitBounds(L.latLngBounds(pts.map(i => [i.lat, i.lng])).pad(0.15));
}

function renderMarket(){
  const rows = DATA.market;
  const label = {sale:"Sale €/m²", rent:"Rent €/m²/month"};
  $("#main").innerHTML = `<p class="intro"><b>Market prices.</b> Median asking price per m² from every listing seen in the
    last months — the yardstick the researchers use for “under market”. Asking prices run above final sale prices.</p>
    <div class="controls"><input type="search" id="mq" placeholder="Filter city…"></div>
    <div class="tablewrap"><table><thead><tr><th>Type</th><th>Deal</th><th>Location</th><th class="num">Median</th><th class="num">Listings</th></tr></thead>
    <tbody id="mt"></tbody></table></div>`;
  const fill = q => $("#mt").innerHTML = rows.filter(r => !q || r.city.toLowerCase().includes(q.toLowerCase()))
    .map(r => `<tr><td>${esc(KIND[r.kind]||r.kind)}</td><td>${esc(label[r.deal]||r.deal)}</td><td>${esc(r.city)}</td>
      <td class="num">${r.median_ppm2.toLocaleString("en-GB")} €</td><td class="num">${r.samples}</td></tr>`).join("");
  fill(""); $("#mq").oninput = e => fill(e.target.value);
}

function renderRuns(){
  $("#main").innerHTML = `<p class="intro"><b>Run log.</b> The scraper runs twice a day. “blocked” means the site refused
    automated requests — the run stops rather than forcing its way in.</p>
    <div class="tablewrap"><table><thead><tr><th>Started (UTC)</th><th>Status</th><th class="num">Pages</th><th class="num">Details</th>
    <th class="num">New</th><th class="num">Price changes</th><th>Note</th></tr></thead><tbody>
    ${DATA.runs.map(r => `<tr><td>${esc((r.started_at||"").replace("T"," ").slice(0,16))}</td>
      <td><span class="dot ${r.status==="ok"?"":r.status==="running"?"warn":"bad"}"></span> ${esc(r.status)}</td>
      <td class="num">${r.pages ?? ""}</td><td class="num">${r.details ?? ""}</td><td class="num">${r.new_listings ?? ""}</td>
      <td class="num">${r.price_changes ?? ""}</td><td>${esc(r.message||"")}</td></tr>`).join("")}
    </tbody></table></div>`;
}
</script>
</body>
</html>
