# ============================================================================
#  Business Idea Finder: settings
#  Edit, commit, and the next daily run uses them.
# ============================================================================

# Who the ideas are for. This matters more than anything else in this file:
# Claude can only fit ideas to what it knows about you. Fill in the empty
# fields; empty ones are left out of the prompt.
[profile]
about = "Based in Skopje, North Macedonia. Can sell online to the EU, UK, US and the Balkans. Uses Claude (API and Claude Code) to automate research, writing, coding, outreach drafts, support and reporting."
languages = "Macedonian, English"
skills = ""              # e.g. "performance marketing, Meta and Google ads, Shopify, sales"
assets = ""              # e.g. "agency with 20 clients, 5k LinkedIn followers, a dev on retainer"
hours_per_week = 10      # time you can give a new idea
avoid = ""               # e.g. "crypto, gambling, anything needing a physical shop"

[filters]
# Ideas outside these limits are dropped before you ever see them.
max_startup_cost_eur = 5000
min_annual_profit_eur = 10000      # the realistic upper estimate must reach this
min_automation_pct = 40            # share of recurring work Claude can do

[run]
model = "claude-opus-5-5"
# Server-side refusal fallback: if the model declines, the API reruns the
# request on another model inside the same call. Set false to switch it off.
refusal_fallback = true
research_effort = "medium"         # low | medium | high | xhigh | max
ideate_effort = "high"
max_web_searches = 10              # cap per API request, $10 per 1,000 searches
candidates_per_run = 10            # Claude writes this many ...
send_per_run = 5                   # ... you get the best this many (one is a wildcard after 5 ratings)
keep_candidates_days = 14          # unsent ideas compete again for this long
max_per_category = 2               # variety in each daily batch
exploration = 0.6                  # 0 = only send what you liked before; higher = try more new kinds

# Estimated cost per run, shown in Telegram. Claude Opus 5.5 list prices (USD).
[prices]
input_per_mtok = 4.0
output_per_mtok = 20.0
cache_write_per_mtok = 5.0
cache_read_per_mtok = 0.2
web_search_per_1000 = 10.0

# Research lenses: each day the run picks two. One is the lens whose ideas you
# rated best so far, the other one you've seen least. Add your own.
[lenses]
"Regulation and deadlines" = "New EU or national rules with a compliance deadline (AI Act, accessibility, e-invoicing, NIS2, CSRD, GDPR enforcement) that force small companies to buy help"
"New AI capabilities" = "Model, API or tool launches in the last 60 days that make a costly service suddenly cheap to automate"
"Complaints and unmet demand" = "Reddit, forums, reviews and Q&A sites where people describe a recurring pain and say they would pay"
"Marketplace trends" = "Rising categories and gaps on Etsy, Amazon, Shopify app store, Fiverr/Upwork, Gumroad, app stores"
"SMB operations" = "Boring back-office work (bookkeeping prep, scheduling, quoting, compliance paperwork, reporting) small firms still do by hand"
"Balkans and North Macedonia" = "Local or regional gaps: services common in the EU but missing or expensive in North Macedonia and the Balkans, EU funds, diaspora demand"
"Price arbitrage" = "Services sold cheaply in one market and expensively in another, which AI plus a local operator can deliver"
"Content and media" = "Niche newsletters, data products, directories and media sites that earn from subscriptions, sponsors or leads"
"Lead generation and data" = "Businesses that pay for qualified leads, enriched lists, monitoring or alerts built from public data"
